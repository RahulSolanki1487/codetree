name: CI
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The bundle, the viewer assets and the grammar checksums are up to date
        run: |
          npm run build
          node scripts/grammars.mjs
          git -c core.fileMode=false diff --exit-code -- scripts/codetree.mjs src/viewer-assets.js src/grammar-hashes.js grammars
      - run: npm test
